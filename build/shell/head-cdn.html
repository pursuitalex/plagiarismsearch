<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet" />
<meta name="googlebot" content="noindex, nofollow" />
<title>PlagiarismSearch — Plagiarism + AI detection in one</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=Flow+Circular&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        sans: ['Manrope', 'system-ui', 'sans-serif'],
        serif: ['Newsreader', 'Georgia', 'serif'],
      },
      colors: {
        orange: { 50:'#FEF4F1',100:'#FDE5E0',200:'#FBC9BF',300:'#F8A392',400:'#F58971',500:'#F36F5A',600:'#DC5A45',700:'#B84431',800:'#8C2E1F',900:'#5D1E13' },
        teal:   { 50:'#E8F8FB',100:'#D3F1F6',200:'#A7E3ED',300:'#6ED7E8',400:'#2CC3DB',500:'#0CA9C3',600:'#0991A8',700:'#06748A',800:'#045566',900:'#023744' },
        mint:   { 50:'#EDFAF4',100:'#DCF5EA',200:'#B3E9D1',400:'#5ED2A0',500:'#3AC184',600:'#2AA46C',700:'#1B7A50' },
        ink:    { 0:'#FFFFFF',50:'#F8F9FB',100:'#F1F2F6',200:'#E5E7EB',300:'#D1D5DB',400:'#9CA3AF',500:'#6B7280',600:'#4B5563',700:'#374151',800:'#1F2937',900:'#111827',950:'#0A0E1A' },
      },
      letterSpacing: { tightest: '-0.035em' },
      boxShadow: {
        'diffuse': '0 1px 2px rgba(0,0,0,.04), 0 20px 40px -15px rgba(0,0,0,.08)',
        'diffuse-lg': '0 2px 6px rgba(0,0,0,.05), 0 32px 64px -16px rgba(0,0,0,.12)',
        'inner-hl': 'inset 0 1px 0 rgba(255,255,255,.45)',
      },
      borderRadius: { '4xl': '2rem', '5xl': '2.5rem' },
    }
  }
}
</script>
<style>
  /* A fixed layer sizes against window.innerWidth, not the layout viewport. When the two
     disagree — a narrowed preview pane reports innerWidth 540 inside a 390px viewport — the
     grain sheet and the header render 150px wider than the page and open a white gutter that
     no in-flow element accounts for. overflow-x:clip on the root removes it; unlike hidden it
     creates no scroll container, so position:sticky in the scan scene keeps working. */
  html { background:#fff; overflow-x: clip; }
  body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  ::selection { background:#F36F5A; color:#fff; }

  /* ---------- grain overlay ---------- */
  .grain { position:fixed; inset:0; z-index:60; pointer-events:none; opacity:.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size:256px 256px; }

  /* ---------- mesh orbs (masked gradient — zero per-frame filter cost) ---------- */
  .orb { position:absolute; border-radius:9999px; pointer-events:none;
    -webkit-mask-image:radial-gradient(circle closest-side, rgba(0,0,0,1) 0%, rgba(0,0,0,.5) 48%, transparent 74%);
    mask-image:radial-gradient(circle closest-side, rgba(0,0,0,1) 0%, rgba(0,0,0,.5) 48%, transparent 74%); }

  /* ---------- reveal (transform/opacity only — compositor-friendly) ---------- */
  .rv { opacity:0; transform:translateY(40px); }
  .no-motion .rv { opacity:1 !important; transform:none !important; }
  .hero-float, #scanLine, #probBar { will-change: transform; }

  /* ---------- scan highlights ---------- */
  .hl { background-repeat:no-repeat; background-size:0% 100%; border-radius:.25em; padding:.05em .1em; margin:-.05em -.1em;
        transition:color .3s ease; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
  .hl-orange { background-image:linear-gradient(to right, rgba(243,111,90,.16), rgba(243,111,90,.16)); }
  .hl-teal   { background-image:linear-gradient(to right, rgba(12,169,195,.14), rgba(12,169,195,.14)); }
  /* AI highlight — violet, matching the product report's colour coding */
  .hl-ai     { background-image:linear-gradient(to right, rgba(154,106,222,.18), rgba(154,106,222,.18)); }
  .hl.on-orange { color:#B84431; font-weight:600; }
  .hl.on-teal { color:#06748A; font-weight:600; }
  .hl.on-ai { color:#6D3FB0; font-weight:600; }

  /* scan legend — dots light up as each category is found */
  .lg-item { opacity:.35; transition:opacity .45s cubic-bezier(.32,.72,0,1); }
  .lg-item.found { opacity:1; }
  .lg-dot { box-shadow:0 0 0 0 currentColor; transition:box-shadow .45s cubic-bezier(.32,.72,0,1); }
  .lg-item.found .lg-dot { box-shadow:0 0 0 3px color-mix(in srgb, currentColor 22%, transparent); }
  .no-motion .lg-item { opacity:1; }

  /* ================= CTA SECTION · single source of truth =================
     Every visual knob of the closing CTA lives here as a custom property.
     Edit these numbers (or drive them live with ?tune=cta) — nothing else needs touching.
     Breakpoint overrides go in the two media queries at the bottom of this block. */
  #cta {
    /* base plate */
    --cta-bg:          #F2FCFC;
    /* wash: a soft directional gradient laid over the plate */
    --cta-wash-angle:  180deg;
    --cta-wash-from:   rgba(255,255,255,0);
    --cta-wash-mid:    rgba(255,255,255,0);
    --cta-wash-midpos: 50%;
    --cta-wash-to:     rgba(255,255,255,0);
    /* glow 1 — warm, upper left */
    --cta-o1-rgb:   243,111,90;
    --cta-o1-alpha: .25;
    --cta-o1-w:     1138px;
    --cta-o1-h:     1040px;
    --cta-o1-x:     -22.2%;
    --cta-o1-y:     -546px;
    --cta-o1-mid:   54.1%;   /* where the mask drops to 50% */
    --cta-o1-end:   83.2%;   /* where it reaches full transparency */
    /* glow 2 — cool, lower right */
    --cta-o2-rgb:   13,168,194;
    --cta-o2-alpha: .15;
    --cta-o2-w:     954px;
    --cta-o2-h:     950px;
    --cta-o2-x:     74.2%;
    --cta-o2-y:     374px;
    --cta-o2-mid:   65%;
    --cta-o2-end:   100%;

    background-color: var(--cta-bg);
    background-image: linear-gradient(var(--cta-wash-angle),
      var(--cta-wash-from) 0%, var(--cta-wash-mid) var(--cta-wash-midpos), var(--cta-wash-to) 100%);
  }
  #ctaOrb1 { width:var(--cta-o1-w); height:var(--cta-o1-h); left:var(--cta-o1-x); top:var(--cta-o1-y);
    background:rgba(var(--cta-o1-rgb), var(--cta-o1-alpha));
    -webkit-mask-image:radial-gradient(circle closest-side, rgba(0,0,0,1) 0%, rgba(0,0,0,.5) var(--cta-o1-mid), transparent var(--cta-o1-end));
            mask-image:radial-gradient(circle closest-side, rgba(0,0,0,1) 0%, rgba(0,0,0,.5) var(--cta-o1-mid), transparent var(--cta-o1-end)); }
  #ctaOrb2 { width:var(--cta-o2-w); height:var(--cta-o2-h); left:var(--cta-o2-x); top:var(--cta-o2-y);
    background:rgba(var(--cta-o2-rgb), var(--cta-o2-alpha));
    -webkit-mask-image:radial-gradient(circle closest-side, rgba(0,0,0,1) 0%, rgba(0,0,0,.5) var(--cta-o2-mid), transparent var(--cta-o2-end));
            mask-image:radial-gradient(circle closest-side, rgba(0,0,0,1) 0%, rgba(0,0,0,.5) var(--cta-o2-mid), transparent var(--cta-o2-end)); }

  /* ---- CTA · tablet (max 1023px) ---- */
  @media (max-width:1023px) { #cta { } }
  /* ---- CTA · mobile (max 639px) ---- */
  @media (max-width:639px)  { #cta { } }

  /* ---------- Trustpilot review rail ---------- */
  .tp-scroll { scrollbar-width:none; -ms-overflow-style:none; }
  .tp-scroll::-webkit-scrollbar { display:none; }
  .tp-star { width:16px; height:16px; background:#00B67A; display:flex; align-items:center; justify-content:center; }
  .tp-nav { transition:opacity .3s ease, transform .3s cubic-bezier(.32,.72,0,1), box-shadow .3s ease; }
  .tp-nav:hover { transform:translateY(-50%) scale(1.06); }
  .tp-nav:active { transform:translateY(-50%) scale(.96); }
  .tp-nav[disabled] { opacity:0 !important; pointer-events:none; }
  .tp-dot { transition:width .35s cubic-bezier(.32,.72,0,1), background-color .3s ease; }

  /* ---------- language live-scan block ---------- */
  .pill-lang { transition: background-color .3s ease, color .3s ease, box-shadow .3s ease; }
  .pill-lang.active { background:#111827; color:#fff; }

  /* ---------- pen annotations (reduced-motion: static final state) ---------- */
  .no-motion #freeWord, .no-motion #oneWord { color:#DC5A45; }
  .no-motion #oneUnderline, .no-motion #freeCirclePath { opacity:1; }

  /* ---------- hero paper document (Flow font renders text as redacted bars) ---------- */
  .font-flow { font-family:'Flow Circular', cursive; }
  /* drop-shadow on the parent: clip-path on the sheet would eat its own box-shadow,
     while a parent filter wraps the already-clipped silhouette (incl. the dog-ear) */
  .paper-doc { filter: drop-shadow(0 1px 2px rgba(17,24,39,.05)) drop-shadow(0 18px 36px rgba(17,24,39,.13)); }
  .paper-doc .paper-sheet {
    clip-path: polygon(0 0, calc(100% - 52px) 0, 100% 52px, 100% 100%, 0 100%);
    border: 1px solid rgba(17,24,39,.07);
    border-radius: 16px; /* rounds 3 corners + curves the border; the 4th is cut by the clip */
  }
  .paper-doc .paper-fold {
    position:absolute; top:0; right:0; width:52px; height:52px;
    background: linear-gradient(225deg, rgba(0,0,0,0) 50%, #E9EBF0 50%, #F8F9FB 98%);
    border-bottom-left-radius: 12px;
    filter: drop-shadow(-5px 5px 6px rgba(17,24,39,.10));
  }

  /* ---------- hero avatar stack (Figma 5379:2064 — 32px circles on a 22px step) ---------- */
  .avatar-stack img { filter: drop-shadow(-1px 0 2px rgba(17,24,39,.07)); }
  .avatar-stack img + img { margin-left: -10px; }

  /* ---------- breathing bar ---------- */
  @keyframes breathe { 0%,100% { width:26%; } 50% { width:38%; } }
  .breathe { animation:breathe 4.5s cubic-bezier(.45,0,.25,1) infinite; }
  .no-motion .breathe { animation:none; width:32%; }

  @keyframes pulse-dot { 0%,100% { opacity:1; transform:scale(1);} 50% { opacity:.45; transform:scale(.8);} }
  .pulse-dot { animation:pulse-dot 2.2s ease-in-out infinite; }

  /* ---------- FAQ accordion ---------- */
  .faq-a { display:grid; grid-template-rows:0fr; transition:grid-template-rows .5s cubic-bezier(.32,.72,0,1); }
  .faq-item.open .faq-a { grid-template-rows:1fr; }
  .faq-a > div { overflow:hidden; }
  .faq-chev { transition:transform .45s cubic-bezier(.32,.72,0,1); }
  .faq-item.open .faq-chev { transform:rotate(180deg); }

  /* ---------- persona fade ---------- */
  /* All three panels share one grid cell, so the holder is exactly as tall as the tallest
     of them at any width. It used to be min-h-[380px] with the inactive panels absolutely
     positioned: a number picked for the desktop panel, which left 69px of dead space under
     the active one on a phone and read as a broken gap above the reviews rail. */
  .persona-panel { grid-area:1/1; transition:opacity .45s cubic-bezier(.32,.72,0,1), transform .45s cubic-bezier(.32,.72,0,1); }
  .persona-panel.hidden-panel { opacity:0; transform:translateY(14px); pointer-events:none; }

  /* ---------- buttons ---------- */
  .btn-press { transition:transform .25s cubic-bezier(.32,.72,0,1), box-shadow .25s ease; }
  .btn-press:active { transform:scale(.97); }
  /* circle stays put; only the arrow inside rotates 45° counter-clockwise */
  .icon-orb svg { transition:transform .35s cubic-bezier(.32,.72,0,1); }
  .group:hover .icon-orb svg { transform:rotate(-45deg); }

  .nums { font-variant-numeric: tabular-nums; }

  /* ---------- island nav dropdowns ---------- */
  .nav-chev { opacity:.45; transition:transform .2s cubic-bezier(.32,.72,0,1); }
  .nav-item:hover .nav-chev, .nav-item:focus-within .nav-chev { transform:rotate(180deg); }
  .nav-drop { opacity:0; visibility:hidden; transform:translate(-50%,-6px);
    transition:opacity .2s ease, transform .2s cubic-bezier(.32,.72,0,1), visibility .2s; }
  .nav-item:hover .nav-drop, .nav-item:focus-within .nav-drop { opacity:1; visibility:visible; transform:translate(-50%,0); }
  @media (prefers-reduced-motion: reduce) { .nav-drop, .nav-chev { transition:none; } }
  /* ---------- header below lg: burger + panel ---------- */
  .nav-burger-close { display:none; }
  #navBurger[aria-expanded="true"] .nav-burger-open { display:none; }
  #navBurger[aria-expanded="true"] .nav-burger-close { display:block; }

  .nav-panel { position:absolute; left:1rem; right:1rem; top:100%;
    opacity:0; visibility:hidden; transform:translateY(-8px);
    transition:opacity .22s ease, transform .22s cubic-bezier(.32,.72,0,1), visibility .22s; }
  .nav-panel.open { opacity:1; visibility:visible; transform:translateY(0); }
  @media (prefers-reduced-motion: reduce) { .nav-panel { transition:none; } }


  /* ---------- controls on phones ----------
     These sizes are declared in CSS rather than as utility classes, so they need
     their own breakpoint. Field heights come down with the text so the controls
     keep their proportions instead of turning into tall boxes with small labels. */
  @media (max-width: 639px) {
    .qc-area, .rc-area, .sp-area { font-size: 14px; }
    .fld, .cf-field { height: 44px; font-size: 14px; }
    textarea.fld { height: auto; }
    .stepper { height: 44px; }
    .stepper input { font-size: 14px; }
    .stepper button { width: 34px; font-size: 16px; }
    .pa-select { height: 40px; font-size: 13px; }
    .pa-step { height: 40px; }
    .pa-step input { font-size: 13px; }
    .pa-step button { width: 32px; font-size: 15px; }
    .sp-select { height: 36px; font-size: 12px; }
    .qc-chip { height: 34px; font-size: 12px; padding: 0 12px; }
    .chip-opt span { height: 30px; font-size: 11.5px; padding: 0 11px; }
    .rc-stat b { font-size: 17px; }
    .sp-row { font-size: 12px; }
    .hc-search { height: 48px; font-size: 14px; padding: 0 96px 0 44px; }
    .cf-label { font-size: 11.5px; }
    .ctl { font-size: 13.5px; }
  }
  /* the scan scene pins and scrubs only from lg up; below that it is a normal section */
  @media (min-width: 1024px) { #scanWrap { height: 285vh; } }

</style>
</head>
<body class="font-sans text-ink-900 bg-white">
